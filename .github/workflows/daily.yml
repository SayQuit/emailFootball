name: Daily Football News Email

on:
  schedule:
    # 每天两份：北京时间 06:47（UTC 前一天 22:47）和 17:47（UTC 09:47）。
    # 用非整点避开 GitHub 定时任务高峰，仍可能延迟几分钟到几十分钟
    - cron: "47 22 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
